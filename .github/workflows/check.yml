name: Check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix flake check --print-build-logs
      - run: nix develop --command ruff check nix_clipboard_history tests
      - run: nix develop --command ruff format --check nix_clipboard_history tests
      - run: nix fmt -- --check flake.nix nix/*.nix
      - run: nix develop --command bash tests/run-gtk-smoke.sh
      - run: nix build
      - run: nix develop --command env PYTHONPATH=. python tests/wayland_smoke.py --package ./result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gtk-screenshot
          path: artifacts/clipboard*.png
