[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nix-clipboard-history"
version = "0.1.0"
description = "A keyboard-first clipboard history for Nix and Hyprland"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
nix-clipboard-history = "nix_clipboard_history.cli:main"

[tool.setuptools.packages.find]
include = ["nix_clipboard_history*"]

[tool.setuptools.package-data]
nix_clipboard_history = ["style.css"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
